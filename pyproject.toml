[project]
name = "omartest"
version = "0.1.0"
description = "Agent Coliseum agents (Condor RAG, LangChain-style, naive baseline) ported from Colab notebooks"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "numpy>=2.4.6",
    "openai>=1.0",
    "pyngrok>=8.1.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff.lint]
# Scoped to real-bug rules only (syntax errors, undefined names, invalid
# comparisons). The code base predates any linting; stylistic rules are
# intentionally left off so the check is green without unrelated rewrites.
select = ["E9", "F63", "F7", "F82"]
