    "flask-cors>=6.0.5",
    "numpy>=2.4.6",
    "openai>=1.0",
    "pyngrok>=8.1.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
]
